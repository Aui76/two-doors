# The museum's harness. Every exhibit is a Foundry test that forks a public chain
# at a named block and prints what it finds.

[profile.default]
src = "src"
test = "exhibits"
out = "out"
# deps, not Foundry's usual lib, so that every hull source sorts ahead of exhibits/.
# Under via_ir, AuditCell's bytes depend on which sources come before it in the
# compilation unit: with exhibits/ first, two of its immutables trade memory slots
# (0x80 and 0xa0) and 23 bytes change. With the hull first, the stand builds the
# same AuditCell as the hull compiled alone. Basescan refused the first fixture's
# AuditCell as 59 sources and verified the second's from 13 (PC-138, 2026-09-29).
libs = ["deps"]
solc = "0.8.20"
optimizer = true
# The hull's own build settings (cell/foundry.toml in deps/dan), not the museum's
# preference: the point of Room 1 is to stand the cured hull at 0f3eaf8 beside the
# artifact, so it is compiled the way it ships. AuditCell needs via_ir and a low
# runs count to fit under EIP-170; at runs = 200 it would not deploy.
optimizer_runs = 1
via_ir = true
remappings = [
  "forge-std/=deps/forge-std/src/",
  # The hull. deps/dan is a submodule of DAN's public repository,
  # Aui76/decentralized-audit-network, pinned at 5f2012b. Its contracts and deploy
  # scripts are those of 0561a4b (VD-239(3)); the three commits since change CI, the
  # NOTICE, the cell's foundry.toml and the site, none of them compiled here. It replaced a
  # local link to the private cell tree, which a clone of this repo could not follow.
  # Its cell/contracts/ are the cured hull at 0f3eaf8 with one difference: the 8
  # interfaces carry an MIT licence line where the private tree has BUSL-1.1. That
  # line goes into the compiled metadata, so AuditCell's bytes here differ from a
  # build of the private tree. No exhibit compares against those bytes.
  # Inside the tree, not beside it: a remapping that points outside the project root
  # makes foundry compile every hull source twice, under a relative and an absolute
  # spelling of one path, and the two AuditCell artifacts cannot be linked.
  # Not vendored: the hull is BUSL-1.1 and this tree is MIT.
  "dan/=deps/dan/cell/contracts/",
  "genesis-tools/=deps/dan/cell/contracts/tools/",
  # The Balancer room's replay imports Balancer's own StableMath, which pulls in
  # four files of @balancer-labs/v2-solidity-utils (math + one error helper). They
  # are vendored beside the replay at v2-solidity-utils@2.0.0 (unpkg) with their
  # pragma bumped from ^0.7.0 to >=0.7.0 <0.9.0 — the exact install step
  # DeFiHackLabs' StableMath.sol documents in its own header. Kept under the exhibit,
  # never in deps/, so hull source ordering and AuditCell's bytes are untouched.
  "@balancer-labs/v2-solidity-utils/=exhibits/balancer-2025-11/replay/balancer-v2-solidity-utils/",
]
auto_detect_remappings = false
# The raw fetched reference (replay/*.orig.sol) is a transient, hash-pinned copy of
# public history brought in by the README's curl step — display, not this project's
# code. It carries the upstream file's own imports (interface.sol), which do not
# resolve here, so compiling it would break the build (PC-131). It is skipped from
# compilation and gitignored; the compiled artifact is the transcribed Replay.t.sol.
skip = ["*.orig.sol"]

# The provenance test reads the spec and the specimens and re-hashes them. Specimens
# sit outside src and test on purpose: they are Beanstalk's 0.7.6 sources, on display,
# not code this project compiles.
#
# One directory is writable: Room 2's fixture record (VD-270(iv)), written by the
# fixture's own deploy so its addresses are printed, never typed. Nothing else in
# the tree can be written from a script, including the hull's deployments/.
fs_permissions = [
  { access = "read", path = "./exhibits" },
  { access = "read", path = "./specimens" },
  { access = "read-write", path = "./exhibits/beanstalk-2022-04/fixture/record" },
]

[rpc_endpoints]
# Archive access. eth.drpc.org answers state reads at 2022 blocks without a key,
# which is how the day-one provenance was pulled; override it with your own.
mainnet = "${MAINNET_ARCHIVE_RPC_URL}"
